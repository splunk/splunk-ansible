---
# set_config_file.yml has restored the desired noahService stanza at this point.
# Apply exactly one role profile before the first full splunkd start.
- include_tasks: validate.yml

- name: Persist the stable Kubernetes server name before splunkd starts
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: general
    option: serverName
    value: "{{ splunk.server_name }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.server_name is defined
    - splunk.server_name is not none

- name: Configure the {{ splunk_noah_client_profile.client_role }} Noah client profile
  include_tasks: "{{ splunk_noah_client_profile.task_file }}"

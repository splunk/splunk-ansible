---
# enable_admin_auth.yml starts a temporary no-auth splunkd. Keep Noah disabled
# for that process, but write every required field so its config parser is safe.
- include_tasks: validate.yml

- name: Validate the operator-provided Noah service configuration
  assert:
    that:
      - >-
        (((splunk.conf | default({})).get('server', {})).get('content', {})).get('noahService')
        is mapping
      - >-
        (((splunk.conf | default({})).get('server', {})).get('content', {})).get('noahService', {}).get('uri', '')
        | length > 0
      - >-
        (((splunk.conf | default({})).get('server', {})).get('content', {})).get('noahService', {}).get('tenant', '')
        | length > 0
    fail_msg: >-
      SPLUNK_NOAH_ENABLED=true requires splunk.conf.server.content.noahService
      in the docker-splunk defaults.

- name: Write Noah service configuration for temporary authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: "{{ item.key }}"
    value: "{{ 'true' if item.key == 'disabled' else item.value }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  with_dict: "{{ splunk.conf.server.content.noahService }}"
  no_log: "{{ hide_password }}"

- name: Keep Noah disabled during temporary authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: disabled
    value: "true"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"

- name: Write a parseable role-specific Noah heartbeat before authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: heartbeatPeriod
    value: "{{ splunk_noah_client_profile.heartbeat_period }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"

- name: Write the Noah symmetric key when supplied through docker-splunk defaults
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: pass4SymmKey
    value: "{{ splunk.pass4SymmKey }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.pass4SymmKey is defined
    - splunk.pass4SymmKey
  no_log: true

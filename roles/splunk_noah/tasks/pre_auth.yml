---
# enable_admin_auth.yml starts a temporary no-auth splunkd. Keep Noah disabled
# for that process, but write every required field so its config parser is safe.
- include_tasks: validate.yml

- name: Normalize list-form server.conf at the Noah role boundary
  include_tasks: normalize_conf.yml
  when: splunk.conf is not mapping

- name: Extract the noahService stanza from splunk.conf (dict format)
  set_fact:
    noah_service_stanza: >-
      {{ splunk.conf.server.content.noahService }}
  when: splunk.conf is mapping
  no_log: true

- name: Initialize the noahService stanza for list-form splunk.conf
  set_fact:
    noah_service_stanza: {}
  when: splunk.conf is not mapping
  no_log: true

- name: Merge the noahService stanza from list-form splunk.conf
  set_fact:
    noah_service_stanza: >-
      {{ noah_service_stanza | combine(item.value.content.noahService, recursive=true) }}
  loop: "{{ splunk_conf_effective }}"
  when:
    - splunk.conf is not mapping
    - item is mapping
    - item.get('key') == 'server'
    - item.get('value', {}) is mapping
    - item.get('value', {}).get('content', {}) is mapping
    - item.get('value', {}).get('content', {}).get('noahService', {}) is mapping
    - >-
      (item.get('value', {}).get('directory')
      | default(splunk.home + '/etc/system/local', true)
      | normalize_splunk_conf_path) ==
      ((splunk.home + '/etc/system/local') | normalize_splunk_conf_path)
  no_log: true

- name: Validate the operator-provided Noah service configuration
  assert:
    that:
      - noah_service_stanza is mapping
      - noah_service_stanza | length > 0
      - noah_service_stanza.get('uri', '') | length > 0
      - noah_service_stanza.get('tenant', '') | length > 0
      - noah_service_stanza.get('pass4SymmKey', '') | length > 0
    fail_msg: >-
      SPLUNK_NOAH_ENABLED=true requires splunk.conf to contain a server entry
      for {{ splunk.home }}/etc/system/local with content.noahService including
      'uri', 'tenant', and 'pass4SymmKey'.

- name: Write Noah service configuration for temporary authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: "{{ item.key }}"
    value: "{{ 'true' if item.key == 'disabled' else item.value }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  with_dict: "{{ noah_service_stanza }}"
  no_log: "{{ hide_password }}"

- name: Keep Noah disabled during temporary authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: disabled
    value: "true"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"

- name: Write a parseable role-specific Noah heartbeat before authentication startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: noahService
    option: heartbeatPeriod
    value: "{{ splunk_noah_client_profile.heartbeat_period }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"

# The Noah symmetric key is delivered exclusively through
# splunk.conf.server.content.noahService (written by the with_dict loop
# above). It must NOT fall back to the Splunk-to-Splunk [general] key,
# which is a different credential.

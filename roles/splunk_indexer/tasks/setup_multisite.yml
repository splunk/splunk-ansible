---
# CSPL-4136: when configure_indexer_cluster_prestart.yml already wrote cluster
# membership and site into server.conf before the first splunkd start, splunkd is
# already a peer and this post-start join is unnecessary. Retained as a fallback for
# the cases where the pre-seed could not be applied or verified, since any server.conf
# write after splunkd is running sets restart_required and forces a second startup.
- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.multisite_master }}"
  when: not (idxc_cluster_preseeded | default(false) | bool)

- name: Convert Extrenal Cluster Master Name into Internal URI
  set_fact:
      multisite_master_uri: "{{ cert_prefix }}://{{ splunk.multisite_master }}:{{ splunk.svc_port }}"

- name: Check if SSL replication port is configured in server.conf
  set_fact:
    has_ssl_replication_port_in_conf: "{{ 'conf' in splunk and 'server' in splunk.conf and 'content' in splunk.conf.server and (splunk.conf.server.content.keys() | select('match', '^replication_port-ssl://') | list | length > 0) }}"

- name: Determine SSL replication mode
  set_fact:
    use_ssl_replication: "{{ (splunk.idxc.replication_ssl | default(false) | bool) or (has_ssl_replication_port_in_conf | default(false) | bool) }}"

# -replication_port is required by the REST API even in SSL mode; the SSL stanza is restored below.
- name: Setup Peers with Associated Site
  command: "{{ splunk.exec }} edit cluster-config -mode slave -site {{ splunk.site }} -master_uri {{ multisite_master_uri }} -replication_port {{ splunk.idxc.replication_port }} -auth {{ splunk.admin_user }}:{{ splunk.password }} -secret {{ splunk.idxc.pass4SymmKey }}"
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  changed_when: task_result.rc == 0
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  when: not (idxc_cluster_preseeded | default(false) | bool)
  notify:
      - Restart the splunkd service
  no_log: "{{ hide_password }}"

# splunkd loads the non-SSL stanza first, so it must be removed or replication falls back to plaintext.
- name: Remove stale non-SSL replication port stanza left by cluster join
  ini_file:
    path: "{{ splunk.home }}/etc/system/local/server.conf"
    section: "replication_port://{{ splunk.idxc.replication_port }}"
    state: absent
  become: yes
  become_user: "{{ splunk.user }}"
  when:
    - use_ssl_replication | bool
    - not (idxc_cluster_preseeded | default(false) | bool)

# set_config_stanza.yml is used here (not set_config_file.yml) because some base images'
# set_config_file.yml rewrites the whole server.conf, wiping the [clustering]/site= just written.
- name: Re-apply SSL replication port configuration
  include_tasks: ../../../roles/splunk_common/tasks/set_config_stanza.yml
  vars:
    conf_file: "server.conf"
    conf_directory: "{{ splunk.home }}/etc/system/local"
    stanza_name: "{{ stanza.key }}"
    stanza_settings: "{{ stanza.value | default({}) }}"
  with_dict: "{{ splunk.conf.server.content }}"
  loop_control:
    loop_var: stanza
  when:
    - use_ssl_replication | bool
    - not (idxc_cluster_preseeded | default(false) | bool)
    - "'conf' in splunk"
    - "'server' in splunk.conf"
    - "'content' in splunk.conf.server"
  no_log: "{{ hide_password }}"


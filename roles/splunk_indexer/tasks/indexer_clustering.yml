---
# A Windows file pre-seed is only sufficient when the running instance has
# initialized its peer component. An unregistered peer is valid here: waiting
# for registration would deadlock the parallel manager/peer provisioning.
- name: Verify pre-seeded Windows peer is active
  when:
    - idxc_cluster_preseeded | default(false) | bool
    - ansible_system is match("CYGWIN.*|Win32NT")
    - not uds_enabled | bool
  vars:
    idxc_peer_disabled_message: "Cluster peer is not enabled on this node, check clustering stanza in server.conf"
    idxc_peer_unregistered_message: >-
      The cluster peer is unable to handle request at this time.  This means either the cluster peer unable to communicate w/ the cluster manager
      OR the cluster manager does not have <repFactor> peers added to the cluster.  Check the cluster manager dashboard and/or manager_uri/secret settings.
  block:
    - name: Read live indexer peer state
      uri:
        url: "{{ cert_prefix }}://127.0.0.1:{{ splunk.svc_port }}/services/cluster/peer/info?output_mode=json"
        method: GET
        user: "{{ splunk.admin_user }}"
        password: "{{ splunk.password }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 10
        status_code: [200, 503]
      register: idxc_prestart_live_peer
      changed_when: false
      no_log: true

    - name: Validate live indexer peer response
      assert:
        that:
          - >-
            (idxc_prestart_live_peer.status == 200
             and idxc_prestart_live_peer.json is mapping
             and idxc_prestart_live_peer.json.entry | default([]) | length == 1
             and idxc_prestart_live_peer.json.entry[0].content is mapping
             and idxc_prestart_live_peer.json.entry[0].content.is_registered | default(none) in [true, false, 0, 1, 'true', 'false'])
            or
            (idxc_prestart_live_peer.status == 503
             and idxc_prestart_live_peer.json is mapping
             and idxc_prestart_live_peer.json.messages | default([]) | length == 1
             and idxc_prestart_live_peer.json.messages[0] is mapping
             and idxc_prestart_live_peer.json.messages[0].type | default('') == 'ERROR'
             and idxc_prestart_live_peer.json.messages[0].text | default('') in
               [idxc_peer_disabled_message, idxc_peer_unregistered_message])
        fail_msg: "Cannot verify the pre-seeded Windows peer state; stopping before cluster configuration is skipped."
        quiet: true

    - name: Use post-start configuration when Windows peer is not active
      set_fact:
        idxc_cluster_preseeded: false
      when: idxc_prestart_live_peer.status == 503 and idxc_prestart_live_peer.json.messages[0].text == idxc_peer_disabled_message

# CSPL-4136: pre-seeding cluster membership normally makes the post-start join
# unnecessary. Windows also verifies the live peer above before relying on the
# file pre-seed. Keep the join as a fallback when pre-seeding was not applied or
# verified: a server.conf write after splunkd starts sets restart_required and forces a
# second splunkd startup.
- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.cluster_master_url }}"
  when: not (idxc_cluster_preseeded | default(false) | bool)

# CSPL-4006: Check if SSL replication port is configured in server.conf
# If SSL port exists, we should NOT use -replication_port flag as it will overwrite the SSL config
- name: Extract server.conf content from splunk.conf (dict format)
  set_fact:
    idxc_server_conf_content: "{{ splunk.conf.server.content }}"
  when:
    - "'conf' in splunk and splunk.conf"
    - splunk.conf is mapping
    - "'server' in splunk.conf"
    - "'content' in splunk.conf.server"

- name: Extract server.conf content from splunk.conf (list format)
  set_fact:
    idxc_server_conf_content: >-
      {{ ((splunk_conf_effective | default(splunk.conf))
          | selectattr('key', 'equalto', 'server') | first | default({}))
          .get('value', {}).get('content', {}) }}
  when:
    - "'conf' in splunk and splunk.conf"
    - splunk.conf is not mapping

- name: Check if SSL replication port is configured in server.conf
  set_fact:
    has_ssl_replication_port_in_conf: >-
      {{ (idxc_server_conf_content | default({})).keys()
         | select('match', '^replication_port-ssl://') | list | length > 0 }}

- name: Determine SSL replication mode
  set_fact:
    use_ssl_replication: "{{ (splunk.idxc.replication_ssl | default(false) | bool) or (has_ssl_replication_port_in_conf | default(false) | bool) }}"

# -replication_port is required by the REST API even in SSL mode; the SSL stanza is restored below.
- name: Set current node as indexer cluster peer
  command: "{{ splunk.exec }} edit cluster-config -mode slave -master_uri '{{ cert_prefix }}://{{ splunk.cluster_master_url }}:{{ splunk.svc_port }}' -replication_port {{ splunk.idxc.replication_port }} -secret '{{ splunk.idxc.pass4SymmKey }}' -auth '{{ splunk.admin_user }}:{{ splunk.password }}'"
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  changed_when: task_result.rc == 0
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: yes
  when: not (idxc_cluster_preseeded | default(false) | bool)
  notify:
    - Restart the splunkd service
  no_log: "{{ hide_password }}"

# splunkd loads the non-SSL stanza first, so it must be removed or replication falls back to plaintext.
- name: Remove stale non-SSL replication port stanza left by cluster join
  ini_file:
    path: "{{ splunk.home }}/etc/system/local/server.conf"
    section: "replication_port://{{ splunk.idxc.replication_port }}"
    state: absent
  become: yes
  become_user: "{{ splunk.user }}"
  when:
    - use_ssl_replication | bool
    - not (idxc_cluster_preseeded | default(false) | bool)

# set_config_stanza.yml expects stanza_name and stanza_settings per iteration;
# the with_dict loop splits idxc_server_conf_content into individual stanzas.
- name: Re-apply SSL replication port configuration
  include_tasks: ../../../roles/splunk_common/tasks/set_config_stanza.yml
  vars:
    conf_file: "server.conf"
    conf_directory: "{{ splunk.home }}/etc/system/local"
    stanza_name: "{{ stanza.key }}"
    stanza_settings: "{{ stanza.value | default({}) }}"
  with_dict: "{{ idxc_server_conf_content | default({}) }}"
  loop_control:
    loop_var: stanza
  when:
    - has_ssl_replication_port_in_conf | default(false) | bool
    - idxc_server_conf_content | default({}) | length > 0
  no_log: "{{ hide_password }}"


---
- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.deployer_url }}"
#INFRA-38882: Update exec command?
- name: Initialize SHC cluster config
  command: "{{ splunk.exec }} init shcluster-config -auth '{{ splunk.admin_user }}:{{ splunk.password }}' -mgmt_uri '{{ cert_prefix }}://{{ splunk.hostname }}:{{ splunk.svc_port }}' -replication_port {{ splunk.shc.replication_port }} -replication_factor {{ splunk.shc.replication_factor }} -conf_deploy_fetch_url '{{ cert_prefix }}://{{ splunk.deployer_url }}:{{ splunk.svc_port }}' -secret '{{ splunk.shc.pass4SymmKey }}' -shcluster_label '{{ splunk.shc.label }}'"
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  # changed_when: false — configure_noah.yml writes all [shcclustering] fields to server.conf
  # before "splunk start", so this call is a no-op verification. Reporting it as never-changed
  # prevents the "Restart the splunkd service" handler from firing (~537s saved per pod restart).
  changed_when: false
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"

- name: Set desired preferred captaincy
  splunk_api:
    method: POST
    url: "/servicesNS/nobody/system/configs/conf-server/shclustering"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    svc_port: "{{ splunk.svc_port }}"
    body:
      preferred_captain: "{{ splunk_search_head_captain | bool | lower }}"
    body_format: "form-urlencoded"
    status_code: "200,409"
    timeout: 10
    use_proxy: no
    cert_prefix: "{{ cert_prefix }}"
  notify:
    - Restart the splunkd service
  register: preferred_captaincy_result
  changed_when: false
  no_log: "{{ hide_password }}"
  when:
    - splunk_search_head_captain is defined and splunk.preferred_captaincy | bool

- name: Flush restart handlers
  meta: flush_handlers

- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_process.yml

- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.deployer_url }}"

- name: Wait for local Splunkd REST before bootstrap
  uri:
    url: "{{ cert_prefix }}://localhost:{{ splunk.svc_port }}/services/server/info"
    method: GET
    url_username: "{{ splunk.admin_user }}"
    url_password: "{{ splunk.password }}"
    force_basic_auth: yes
    validate_certs: false
    use_proxy: no
  register: local_splunkd_ready
  until:
    - local_splunkd_ready.status == 200
  retries: "{{ wait_for_splunk_retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"
  when: splunk_search_head_captain | bool

# Wait for all other SHC members to be reachable before attempting captain bootstrap.
# First-boot Splunk start takes ~499s. The bootstrap retry window (retry_num × retry_delay
# = 60 × 6s = 360s) is shorter than that, so the bootstrap would exhaust retries before
# other members are ready — causing ansible failure → pod restart → ~16 min added to SHC
# readiness. Waiting here ensures bootstrap succeeds on the first attempt.
- name: Wait for all SHC members to be reachable before captain bootstrap
  uri:
    url: "{{ cert_prefix }}://{{ item }}:{{ splunk.svc_port }}"
    method: GET
    validate_certs: false
    use_proxy: no
  register: task_response
  until: task_response.status == 200
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  loop: "{{ groups['splunk_search_head'] | difference([inventory_hostname]) }}"
  when: splunk_search_head_captain | bool
  no_log: "{{ hide_password }}"

#INFRA-38882: Update exec command?
- name: Boostrap SHC captain
  command: "{{ splunk.exec }} bootstrap shcluster-captain -servers_list '{% for host in groups['splunk_search_head'] %}{{ cert_prefix }}://{{ host }}:{{ splunk.svc_port }}{% if not loop.last %},{% endif %}{% endfor %}' -auth '{{ splunk.admin_user }}:{{ splunk.password }}'"
  become: yes
  become_user: "{{ splunk.user }}"
  when: splunk_search_head_captain | bool
  register: task_result
  until: task_result.rc == 0 or "already joined another cluster" in ((task_result.stdout | default('') ~ task_result.stderr | default('')) | lower)
  # configure_noah.yml pre-writes all [shcclustering] fields before splunkd starts, so
  # bootstrap shcluster-captain is a no-op — suppress the restart handler in that case.
  changed_when:
    - task_result.rc == 0
    - not (noah_shc_prestart_configured | default(false) | bool)
  failed_when: task_result.rc !=0 and "already joined another cluster" not in ((task_result.stdout | default('') ~ task_result.stderr | default('')) | lower)
  # Use shc_sync_retry_num (100 × 6s = 600s) instead of retry_num (60 × 6s = 360s).
  # Port 8089 opens before Splunk is fully ready for SHC cluster operations, so other
  # members may reject bootstrap for a few minutes after their REST becomes reachable.
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  environment:
    SPLUNK_URI: "https://127.0.0.1:{{ splunk.svc_port }}"
  notify:
    - Restart the splunkd service
  no_log: "{{ hide_password }}"

#INFRA-38882: Update exec command?
- name: Add new member to SHC
  shell: |
    err="$({{ splunk.exec }} add shcluster-member -current_member_uri {{ cert_prefix }}://{{ splunk.search_head_captain_url }}:{{ splunk.svc_port }} -auth {{ splunk.admin_user }}:{{ splunk.password }} 2>&1 >/dev/null)"
    add_rc=$?
    if {{ splunk.exec }} show shcluster-status -auth {{ splunk.admin_user }}:{{ splunk.password }} 2>/dev/null | grep -q "{{ ansible_hostname }}"; then
      exit 0
    fi
    echo "$err" | grep -q "is already part of cluster" && exit 0
    if [ "$add_rc" -eq 0 ]; then
      exit 0
    fi
    echo "$err" >&2
    exit "$add_rc"
  args:
    executable: /bin/sh
  become: yes
  become_user: "{{ splunk.user }}"
  when: not splunk_search_head_captain | bool
  register: task_result
  changed_when: task_result.rc == 0
  until: task_result.rc == 0
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"

- name: Wait for local splunkd before resync
  uri:
    url: "{{ cert_prefix }}://localhost:{{ splunk.svc_port }}"
    method: GET
    validate_certs: false
    use_proxy: no
  register: local_splunkd_ready
  until:
    - local_splunkd_ready.status == 200
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  failed_when: false
  no_log: "{{ hide_password }}"
  when: not splunk_search_head_captain | bool

- name: Destructive sync search head
  command: "{{ splunk.exec }} resync shcluster-replicated-config -auth {{ splunk.admin_user }}:{{ splunk.password }}"
  become: yes
  become_user: "{{ splunk.user }}"
  environment:
    SPLUNK_URI: "https://127.0.0.1:{{ splunk.svc_port }}"
  when:
    - not splunk_search_head_captain | bool
    - local_splunkd_ready.status | default(0) == 200
  register: task_result
  changed_when: task_result.rc == 0
  failed_when: task_result.rc !=0 and "this instance is the captain" not in task_result.stderr
  until: task_result.rc == 0 or "this instance is the captain" in task_result.stderr
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"

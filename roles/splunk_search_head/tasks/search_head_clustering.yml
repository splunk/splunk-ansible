---
- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.deployer_url }}"
#INFRA-38882: Update exec command?
- name: Initialize SHC cluster config
  command: "{{ splunk.exec }} init shcluster-config -auth '{{ splunk.admin_user }}:{{ splunk.password }}' -mgmt_uri '{{ cert_prefix }}://{{ splunk.hostname }}:{{ splunk.svc_port }}' -replication_port {{ splunk.shc.replication_port }} -replication_factor {{ splunk.shc.replication_factor }} -conf_deploy_fetch_url '{{ cert_prefix }}://{{ splunk.deployer_url }}:{{ splunk.svc_port }}' -secret '{{ splunk.shc.pass4SymmKey }}' -shcluster_label '{{ splunk.shc.label }}'"
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  changed_when: task_result.rc == 0
  until: task_result.rc == 0
  retries: "{{ shc_sync_retry_num if (splunk_noah_enabled | default(false) | bool) else retry_num }}"
  delay: "{{ retry_delay }}"
  notify:
    - Restart the splunkd service
  no_log: "{{ hide_password }}"
  when: not (shc_prestart_configured | default(false) | bool)

- name: Set desired preferred captaincy
  splunk_api:
    method: POST
    url: "/servicesNS/nobody/system/configs/conf-server/shclustering"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    svc_port: "{{ splunk.svc_port }}"
    body:
      preferred_captain: "{{ splunk_search_head_captain | bool | lower }}"
    body_format: "form-urlencoded"
    status_code: "200,409"
    timeout: 10
    use_proxy: no
    cert_prefix: "{{ cert_prefix }}"
  notify:
    - Restart the splunkd service
  register: preferred_captaincy_result
  changed_when: false
  no_log: "{{ hide_password }}"
  when:
    - splunk_search_head_captain is defined and splunk.preferred_captaincy | bool

- name: Flush restart handlers
  meta: flush_handlers
  when: not (shc_prestart_configured | default(false) | bool)

- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_process.yml

- include_tasks: ../../../roles/splunk_common/tasks/wait_for_splunk_instance.yml
  vars:
    splunk_instance_address: "{{ splunk.deployer_url }}"

- name: Wait for all Noah SHC members before captain bootstrap
  uri:
    url: "{{ cert_prefix }}://{{ item }}:{{ splunk.svc_port }}"
    method: GET
    validate_certs: false
    use_proxy: no
  register: noah_shc_member_ready
  until: noah_shc_member_ready.status == 200
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  loop: "{{ groups['splunk_search_head'] | difference([inventory_hostname]) }}"
  when:
    - splunk_noah_enabled | default(false) | bool
    - splunk_search_head_captain | bool
  no_log: "{{ hide_password }}"

#INFRA-38882: Update exec command?
- name: Boostrap SHC captain
  command: "{{ splunk.exec }} bootstrap shcluster-captain -servers_list '{% for host in groups['splunk_search_head'] %}{{ cert_prefix }}://{{ host }}:{{ splunk.svc_port }}{% if not loop.last %},{% endif %}{% endfor %}' -auth '{{ splunk.admin_user }}:{{ splunk.password }}'"
  become: yes
  become_user: "{{ splunk.user }}"
  when: splunk_search_head_captain | bool
  register: task_result
  until: task_result.rc == 0 or "node seems to have already joined another cluster" in task_result.stderr
  changed_when:
    - task_result.rc == 0
    - not (shc_prestart_configured | default(false) | bool)
  failed_when: task_result.rc !=0 and "node seems to have already joined another cluster" not in task_result.stderr
  retries: "{{ shc_sync_retry_num if (splunk_noah_enabled | default(false) | bool) else retry_num }}"
  delay: "{{ retry_delay }}"
  notify:
    - Restart the splunkd service
  no_log: "{{ hide_password }}"

#INFRA-38882: Update exec command?
- name: Add new member to SHC
  command: "{{ splunk.exec }} add shcluster-member -current_member_uri {{ cert_prefix }}://{{ splunk.search_head_captain_url }}:{{ splunk.svc_port }} -auth {{ splunk.admin_user }}:{{ splunk.password }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: not splunk_search_head_captain | bool
  register: task_result
  changed_when: task_result.rc == 0
  failed_when: task_result.rc !=0 and "is already part of cluster" not in task_result.stderr
  until: task_result.rc == 0 or "is already part of cluster" in task_result.stderr
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"

- name: Destructive sync search head
  command: "{{ splunk.exec }} resync shcluster-replicated-config -auth {{ splunk.admin_user }}:{{ splunk.password }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: not splunk_search_head_captain | bool
  register: task_result
  changed_when: task_result.rc == 0
  failed_when: task_result.rc !=0 and "this instance is the captain" not in task_result.stderr
  until: task_result.rc == 0 or "this instance is the captain" in task_result.stderr
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  no_log: "{{ hide_password }}"

# A successful resync command can return before the member finishes its
# add-peer response. Splunk adopts the captain's common splunk.secret and
# re-encrypts protected fields before this health endpoint can report zero
# unpublished changes. During captain failover, the same local state is reported
# with a captain suffix. This is a local key-adoption barrier; end-to-end search
# validation is still required to prove cluster-wide convergence.
- name: Wait for Noah SHC member key adoption
  splunk_api:
    method: GET
    url: "/services/replication/configuration/health?unpublished=1&output_mode=json"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    svc_port: "{{ splunk.svc_port }}"
    cert_prefix: "{{ cert_prefix }}"
    status_code: [200]
    timeout: 10
    use_proxy: no
    return_content: yes
  register: noah_shc_convergence
  changed_when: false
  until:
    - noah_shc_convergence.status == 200
    - noah_shc_convergence.json is mapping
    - noah_shc_convergence.json.entry is defined
    - noah_shc_convergence.json.entry | length > 0
    - noah_shc_convergence.json.entry[0].name | default('') == 'unpublished'
    - noah_shc_convergence.json.entry[0].content is defined
    - (noah_shc_convergence.json.entry[0].content['Number of unpublished changes'] | default('')) in ['0', '0 (this instance is the captain)']
  retries: "{{ shc_sync_retry_num }}"
  delay: "{{ retry_delay }}"
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: "{{ hide_password }}"

- name: Record whether this Noah SHC member is the elected captain
  set_fact:
    noah_shc_local_is_current_captain: >-
      {{
        (noah_shc_convergence.json.entry[0].content['Number of unpublished changes'] | default(''))
        == '0 (this instance is the captain)'
      }}
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool

- name: Read Noah SHC common-secret metadata
  stat:
    path: "{{ splunk.home }}/etc/auth/splunk.secret"
    get_checksum: false
  become: yes
  become_user: "{{ splunk.user }}"
  register: noah_shc_common_secret
  changed_when: false
  failed_when: not noah_shc_common_secret.stat.exists
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: true

- name: Read current splunkd PID-file metadata
  stat:
    path: "{{ splunk.pid }}"
    get_checksum: false
  become: yes
  become_user: "{{ splunk.user }}"
  register: noah_shc_splunkd_pid_file
  changed_when: false
  failed_when: not noah_shc_splunkd_pid_file.stat.exists
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: true

- name: Build the Noah SHC common-secret version marker
  set_fact:
    noah_shc_common_secret_version: >-
      {{
        '%s:%s:%s:%s:%s' | format(
          noah_shc_common_secret.stat.dev,
          noah_shc_common_secret.stat.inode,
          noah_shc_common_secret.stat.size,
          noah_shc_common_secret.stat.mtime,
          noah_shc_common_secret.stat.ctime
        )
      }}
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: true

- name: Check for a previously loaded Noah SHC common-secret version
  stat:
    path: "{{ splunk.pid }}.noah-shc-secret-version"
    get_checksum: false
  become: yes
  become_user: "{{ splunk.user }}"
  register: noah_shc_secret_version_marker
  changed_when: false
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: true

- name: Read the previously loaded Noah SHC common-secret version
  slurp:
    src: "{{ splunk.pid }}.noah-shc-secret-version"
  become: yes
  become_user: "{{ splunk.user }}"
  register: noah_shc_loaded_secret_version
  changed_when: false
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
    - noah_shc_secret_version_marker.stat.exists | default(false)
  no_log: true

- name: Decide whether this Noah SHC member must reload the common secret
  set_fact:
    noah_shc_common_secret_restart_required: >-
      {{
        (noah_shc_common_secret.stat.mtime | float)
        >= (noah_shc_splunkd_pid_file.stat.mtime | float)
        and
        (
          not (noah_shc_secret_version_marker.stat.exists | default(false))
          or
          (noah_shc_loaded_secret_version.content | default('') | b64decode | trim)
          != noah_shc_common_secret_version
        )
      }}
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
  no_log: true

- name: Defer an uncoordinated restart of the elected Noah SHC captain
  fail:
    msg: >-
      The elected SHC captain adopted a new common secret after splunkd started.
      Move captaincy to a healthy member and rerun this play before continuing.
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
    - noah_shc_local_is_current_captain | default(false) | bool
    - noah_shc_common_secret_restart_required | default(false) | bool

- name: Restart Noah SHC member after common-secret convergence
  include_tasks: ../../../roles/splunk_common/handlers/restart_splunk.yml
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
    - not (noah_shc_local_is_current_captain | default(false) | bool)
    - noah_shc_common_secret_restart_required | default(false) | bool

- name: Record the common-secret version loaded by this Noah SHC member
  copy:
    content: "{{ noah_shc_common_secret_version }}\n"
    dest: "{{ splunk.pid }}.noah-shc-secret-version"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: "0600"
  become: yes
  become_user: "{{ splunk.user }}"
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
    - not (noah_shc_local_is_current_captain | default(false) | bool)
    - noah_shc_common_secret_restart_required | default(false) | bool
  no_log: true

- name: Record the Noah SHC post-convergence restart
  set_fact:
    splunk_restart_triggered: true
  when:
    - splunk_noah_enabled | default(false) | bool
    - not splunk_search_head_captain | bool
    - not (noah_shc_local_is_current_captain | default(false) | bool)
    - noah_shc_common_secret_restart_required | default(false) | bool

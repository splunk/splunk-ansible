---
- name: Set expected pre-start SHC endpoints
  set_fact:
    shc_prestart_mgmt_uri: "{{ cert_prefix }}://{{ splunk.hostname }}:{{ splunk.svc_port }}"
    shc_prestart_deployer_uri: "{{ cert_prefix }}://{{ splunk.deployer_url }}:{{ splunk.svc_port }}"
    shc_prestart_server_conf: "{{ splunk.home }}/etc/system/local/server.conf"
    shc_prestart_defer_initial_restart: "{{ first_run | bool }}"

- name: Validate pre-start SHC configuration inputs
  assert:
    that:
      - cert_prefix in ["http", "https"]
      - splunk.hostname | default("") | length > 0
      - splunk.deployer_url | default("") | length > 0
      - splunk.shc.pass4SymmKey | default("") | length > 0
      - splunk.shc.replication_factor | int > 0
      - splunk.shc.replication_port | int > 0
      - splunk.shc.replication_port | int <= 65535
      - splunk.shc.replication_port | int != splunk.svc_port | int
      - splunk.shc.replication_port | int != splunk.http_port | int
      - splunk.shc.replication_port | int != splunk.s2s.port | int
      - splunk.shc.replication_port | int != splunk.kvstore.port | int
    fail_msg: "Pre-start SHC configuration requires valid, non-conflicting endpoints, ports, replication factor, and shared secret."
  no_log: true

- name: Configure the SHC member before Splunk starts
  block:
    - name: Verify the SHC replication port is available
      wait_for:
        host: "127.0.0.1"
        port: "{{ splunk.shc.replication_port }}"
        state: stopped
        timeout: 1

    - name: Create the local Splunk configuration directory
      file:
        path: "{{ splunk.home }}/etc/system/local"
        state: directory
        mode: 0770
        owner: "{{ splunk.user }}"
        group: "{{ splunk.group }}"
      become: yes
      become_user: "{{ splunk.user }}"

    - name: Write the pre-start SHC member configuration
      ini_file:
        path: "{{ shc_prestart_server_conf }}"
        section: "shclustering"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        allow_no_value: false
        state: present
        mode: 0660
        owner: "{{ splunk.user }}"
        group: "{{ splunk.group }}"
      loop:
        - option: "disabled"
          value: "false"
        - option: "mgmt_uri"
          value: "{{ shc_prestart_mgmt_uri }}"
        - option: "replication_factor"
          value: "{{ splunk.shc.replication_factor }}"
        - option: "conf_deploy_fetch_url"
          value: "{{ shc_prestart_deployer_uri }}"
        - option: "pass4SymmKey"
          value: "{{ splunk.shc.pass4SymmKey }}"
      become: yes
      become_user: "{{ splunk.user }}"
      no_log: true

    - name: Write the pre-start SHC label
      ini_file:
        path: "{{ shc_prestart_server_conf }}"
        section: "shclustering"
        option: "shcluster_label"
        value: "{{ splunk.shc.label }}"
        allow_no_value: false
        state: present
        mode: 0660
        owner: "{{ splunk.user }}"
        group: "{{ splunk.group }}"
      become: yes
      become_user: "{{ splunk.user }}"
      when: splunk.shc.label | default("") | length > 0

    - name: Restore the existing SHC cluster identity
      ini_file:
        path: "{{ shc_prestart_server_conf }}"
        section: "shclustering"
        option: "id"
        value: "{{ shc_prestart_cluster_id }}"
        allow_no_value: false
        state: present
        mode: 0660
        owner: "{{ splunk.user }}"
        group: "{{ splunk.group }}"
      become: yes
      become_user: "{{ splunk.user }}"
      when: shc_prestart_cluster_id | default("") | length > 0
      no_log: true

    - name: Write the pre-start SHC replication port
      lineinfile:
        path: "{{ shc_prestart_server_conf }}"
        line: "[replication_port://{{ splunk.shc.replication_port }}]"
        state: present
        create: yes
        mode: 0660
        owner: "{{ splunk.user }}"
        group: "{{ splunk.group }}"
      become: yes
      become_user: "{{ splunk.user }}"

- name: Read effective pre-start SHC configuration
  command:
    argv:
      - "{{ splunk.exec }}"
      - "btool"
      - "server"
      - "list"
      - "shclustering"
      - "--no-log"
  register: shc_prestart_btool
  changed_when: false
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

- name: Read effective pre-start SHC replication port
  command:
    argv:
      - "{{ splunk.exec }}"
      - "btool"
      - "server"
      - "list"
      - "replication_port"
      - "--no-log"
  register: shc_prestart_replication_port_btool
  changed_when: false
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

- name: Validate effective pre-start SHC configuration
  assert:
    that:
      - (shc_prestart_btool.stdout | regex_search("(?m)^disabled\\s*=\\s*(0|false)\\s*$")) is not none
      - ("mgmt_uri = " ~ shc_prestart_mgmt_uri) in shc_prestart_btool.stdout
      - ("replication_factor = " ~ (splunk.shc.replication_factor | string)) in shc_prestart_btool.stdout
      - ("conf_deploy_fetch_url = " ~ shc_prestart_deployer_uri) in shc_prestart_btool.stdout
      - (shc_prestart_btool.stdout | regex_search("(?m)^pass4SymmKey\\s*=\\s*\\S+\\s*$")) is not none
      - splunk.shc.label | default("") | length == 0 or ("shcluster_label = " ~ splunk.shc.label) in shc_prestart_btool.stdout
      - shc_prestart_cluster_id | default("") | length == 0 or ("id = " ~ shc_prestart_cluster_id) in shc_prestart_btool.stdout
      - ("[replication_port://" ~ (splunk.shc.replication_port | string) ~ "]") in shc_prestart_replication_port_btool.stdout
    fail_msg: "Effective pre-start SHC configuration does not match the requested member identity."
  no_log: true

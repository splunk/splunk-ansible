---
# Derive the management URI scheme from the effective SSL configuration rather
# than from cert_prefix, which is set by probing a running splunkd and may be
# stale or incorrect before the first start.  This mirrors the approach used by
# configure_indexer_cluster_prestart.yml.
- name: Resolve effective management scheme for pre-start SHC configuration
  set_fact:
    shc_prestart_scheme: "{{ 'https' if (splunk.ssl.enable | default(true) | bool) else 'http' }}"

- name: Set expected pre-start SHC configuration
  set_fact:
    shc_prestart_server_name: "{{ splunk.server_name | default(splunk.hostname, true) }}"
    shc_prestart_mgmt_uri: "{{ shc_prestart_scheme }}://{{ splunk.hostname }}:{{ splunk.svc_port }}"
    shc_prestart_deployer_uri: >-
      {{ (shc_prestart_scheme ~ "://" ~ splunk.deployer_url ~ ":" ~ splunk.svc_port)
         if (splunk.deployer_url | default("", true) | length > 0)
         else "" }}
    shc_prestart_server_conf: "{{ splunk.home }}/etc/system/local/server.conf"
    shc_prestart_indexer_peer_enabled: >-
      {{
        not (splunk_noah_enabled | default(false) | bool)
        and (splunk_indexer_cluster | bool)
        and (splunk.multisite_master is not defined)
        and (splunk.set_search_peers | default(false) | bool)
      }}

- name: Validate pre-start SHC configuration inputs
  assert:
    that:
      - shc_prestart_scheme in ["http", "https"]
      - shc_prestart_server_name | length > 0
      - splunk.hostname | default("") | length > 0
      - splunk.shc.pass4SymmKey | default("") | length > 0
      - splunk.shc.replication_factor | int > 0
      - splunk.shc.replication_port | int > 0
      - splunk.shc.replication_port | int <= 65535
      - splunk.shc.replication_port | int != splunk.svc_port | int
      - splunk.shc.replication_port | int != splunk.http_port | int
      - splunk.shc.replication_port | int != splunk.s2s.port | int
      - splunk.shc.replication_port | int != splunk.kvstore.port | int
    fail_msg: >-
      Pre-start SHC configuration requires stable identity, valid non-conflicting
      ports, replication factor, and shared secret.
  no_log: true

- name: Validate classic pre-start indexer peering inputs
  assert:
    that:
      - splunk.cluster_master_url | default("") | length > 0
      - splunk.idxc.pass4SymmKey | default("") | length > 0
    fail_msg: >-
      Classic SHC pre-start indexer peering requires a Cluster Manager endpoint
      and indexer-cluster shared secret.
  when: shc_prestart_indexer_peer_enabled | bool
  no_log: true

- name: Create the local Splunk configuration directory
  file:
    path: "{{ splunk.home }}/etc/system/local"
    state: directory
    mode: 0770
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"

- name: Configure stable SHC identity before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "general"
    option: "serverName"
    value: "{{ shc_prestart_server_name }}"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"

- name: Configure SHC formation before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "shclustering"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  loop:
    - option: "disabled"
      value: "false"
    - option: "mgmt_uri"
      value: "{{ shc_prestart_mgmt_uri }}"
    - option: "replication_factor"
      value: "{{ splunk.shc.replication_factor }}"
    - option: "shcluster_label"
      value: "{{ splunk.shc.label }}"
    - option: "register_replication_address"
      value: "{{ shc_prestart_server_name }}"
    - option: "search_head_uri"
      value: "{{ shc_prestart_server_name }}"
  become: yes
  become_user: "{{ splunk.user }}"

- name: Configure SHC deployer fetch URL before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "shclustering"
    option: "conf_deploy_fetch_url"
    value: "{{ shc_prestart_deployer_uri }}"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when: shc_prestart_deployer_uri | length > 0
  become: yes
  become_user: "{{ splunk.user }}"

# When migrating from deployer-backed to deployerless Noah, remove the stale
# conf_deploy_fetch_url so splunkd does not attempt to contact a decommissioned
# deployer.
- name: Remove stale deployer fetch URL when no deployer is configured
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "shclustering"
    option: "conf_deploy_fetch_url"
    state: absent
  when: shc_prestart_deployer_uri | length == 0
  become: yes
  become_user: "{{ splunk.user }}"

# Write the SHC symmetric key on every pre-start run, not just first_run.
# A stopped existing member that receives a rotated key, or one converted to
# SHC, must converge to the requested secret.  Splunk encrypts the plaintext
# value on its first start; on subsequent starts with the same encrypted value,
# ini_file reports no change.
- name: Reconcile the SHC symmetric key before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "shclustering"
    option: "pass4SymmKey"
    value: "{{ splunk.shc.pass4SymmKey }}"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

- name: Configure the SHC replication listener before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "replication_port://{{ splunk.shc.replication_port }}"
    option: "disabled"
    value: "false"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"

- name: Configure classic indexer-cluster peering before splunkd starts
  ini_file:
    path: "{{ shc_prestart_server_conf }}"
    section: "clustering"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    allow_no_value: false
    state: present
    mode: 0660
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  loop:
    - option: "mode"
      value: "searchhead"
    - option: "master_uri"
      value: "{{ shc_prestart_scheme }}://{{ splunk.cluster_master_url }}:{{ splunk.svc_port }}"
    - option: "pass4SymmKey"
      value: "{{ splunk.idxc.pass4SymmKey }}"
  when: shc_prestart_indexer_peer_enabled | bool
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

# Scope btool to the [shclustering] stanza so a pass4SymmKey from [general],
# [clustering], or [noahService] cannot falsely satisfy validation.
- name: Read effective pre-start SHC shclustering configuration
  command:
    argv:
      - "{{ splunk.exec }}"
      - "btool"
      - "server"
      - "list"
      - "shclustering"
      - "--no-log"
  register: shc_prestart_btool_shclustering
  changed_when: false
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

# Read the replication_port stanza separately — it lives outside [shclustering].
- name: Read effective pre-start SHC replication port configuration
  command:
    argv:
      - "{{ splunk.exec }}"
      - "btool"
      - "server"
      - "list"
      - "replication_port://{{ splunk.shc.replication_port }}"
      - "--no-log"
  register: shc_prestart_btool_repl_port
  changed_when: false
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

# Wrap validation and recording in a block so a failed assertion does not
# leave shc_prestart_configured set.  The rescue clears the flag and re-raises
# so the supported initialization path is not suppressed.
- name: Validate and record pre-start SHC configuration
  block:
    - name: Validate effective pre-start SHC configuration
      assert:
        that:
          - (shc_prestart_btool_shclustering.stdout | regex_search("(?m)^disabled\\s*=\\s*(0|false)\\s*$")) is not none
          - ("mgmt_uri = " ~ shc_prestart_mgmt_uri) in shc_prestart_btool_shclustering.stdout
          - ("replication_factor = " ~ (splunk.shc.replication_factor | string)) in shc_prestart_btool_shclustering.stdout
          - (shc_prestart_deployer_uri | length == 0) or (("conf_deploy_fetch_url = " ~ shc_prestart_deployer_uri) in shc_prestart_btool_shclustering.stdout)
          - (shc_prestart_btool_shclustering.stdout | regex_search("(?m)^pass4SymmKey\\s*=\\s*\\S+\\s*$")) is not none
          - ("register_replication_address = " ~ shc_prestart_server_name) in shc_prestart_btool_shclustering.stdout
          - ("search_head_uri = " ~ shc_prestart_server_name) in shc_prestart_btool_shclustering.stdout
          - ("[replication_port://" ~ (splunk.shc.replication_port | string) ~ "]") in shc_prestart_btool_repl_port.stdout
        fail_msg: "Effective pre-start SHC configuration does not match the requested member configuration."
      no_log: true

    - name: Record declarative SHC pre-start configuration
      set_fact:
        shc_prestart_configured: true
        shc_prestart_defer_initial_restart: true
        shc_prestart_indexer_peer_configured: "{{ shc_prestart_indexer_peer_enabled | bool }}"

  rescue:
    - name: Clear SHC pre-start state on validation failure
      set_fact:
        shc_prestart_configured: false
        shc_prestart_defer_initial_restart: false
        shc_prestart_indexer_peer_configured: false

    - name: Report pre-start SHC validation failure
      fail:
        msg: >-
          Pre-start SHC validation failed.  shc_prestart_configured has been
          cleared so the supported initialization path will run instead.

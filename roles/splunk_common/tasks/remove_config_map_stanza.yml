---
- name: Remove ConfigMap-owned options in {{ config_map_stanza_name }}
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    path: "{{ conf_directory }}/{{ conf_file }}"
    section: "{{ config_map_stanza_name }}"
    option: "{{ config_map_stanza_setting.key }}"
    state: absent
    owner: "{{ omit if ansible_system | default('') is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system | default('') is match('CYGWIN.*|Win32NT') else splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  with_dict: "{{ config_map_stanza_settings }}"
  loop_control:
    loop_var: config_map_stanza_setting
  when:
    - config_map_stanza_name and config_map_stanza_settings
    - >-
      not (splunk_kvservice_enabled | default(false) | bool
           and config_map_stanza_name == 'kvstore'
           and config_map_stanza_setting.key == 'defaultKVStoreType')

---
- name: Check for Ansible-managed deployment-scoped KVService settings
  stat:
    path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
  register: kvservice_managed_config

- name: Remove previous Ansible-managed deployment-scoped KVService settings
  block:
    - name: Remove previous KVService mode
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceMode
        state: absent

    - name: Remove legacy KVService scope
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceScope
        state: absent

    - name: Remove legacy KVService deployment mode
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceDeploymentMode
        state: absent

    - name: Remove previous KVService tenant
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: tenant
        state: absent

    - name: Remove previous KVService environment
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: environment
        state: absent

    # KV Store type and startup migration are managed by set_default_kvstore_type.yml.
    # In particular, Splunk 10.9+ owns the saved defaultKVStoreType after migration.
    - name: Remove deployment-scoped KVService management marker
      file:
        path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
        state: absent
  when:
    - kvservice_managed_config.stat.exists
    - splunk.kvstore.kvservice_scope | default('') != 'deployment'

- name: Remove legacy KVService deployment mode when configuring scope
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceDeploymentMode
    state: absent
  when:
    - splunk.kvstore.kvservice_scope | default('', true) | length > 0

- name: Remove legacy KVService mode when configuring scope
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceMode
    state: absent
  when:
    - splunk.kvstore.kvservice_scope | default('', true) | length > 0

- name: Remove legacy KVService connection string
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceConnectionString
    state: absent

- name: Set KVService scope
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceScope
    value: "{{ splunk.kvstore.kvservice_scope }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.kvstore is defined
    - splunk.kvstore.kvservice_scope is defined
    - splunk.kvstore.kvservice_scope | default('', true) | length > 0

- name: Set KVService tenant
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: tenant
    value: "{{ splunk.scs.tenant }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.tenant is defined
    - splunk.scs.tenant | length > 0

- name: Set KVService environment
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: environment
    value: "{{ splunk.scs.environment }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.environment is defined
    - splunk.scs.environment | length > 0

- name: Mark deployment-scoped KVService settings as Ansible-managed
  copy:
    content: "deployment\n"
    dest: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0644'
  when:
    - splunk.kvstore.kvservice_scope | default('') == 'deployment'

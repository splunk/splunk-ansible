---
- name: Check for Ansible-managed installation-scoped KVService settings
  stat:
    path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
  register: kvservice_managed_config

- name: Remove previous Ansible-managed installation-scoped KVService settings
  block:
    - name: Remove previous KVService mode
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceMode
        state: absent

    - name: Remove legacy KVService scope
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceScope
        state: absent

    - name: Remove legacy KVService deployment mode
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceDeploymentMode
        state: absent

    - name: Remove previous KVService tenant
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: tenant
        state: absent

    - name: Remove previous KVService environment
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: environment
        state: absent

    - name: Remove previous KV Store type
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: defaultKVStoreType
        state: absent

    - name: Remove previous Postgres migration setting
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: postgresMigrateOnStartup
        state: absent

    - name: Remove installation-scoped KVService management marker
      file:
        path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
        state: absent
  when:
    - kvservice_managed_config.stat.exists

- name: Check for Ansible-managed KVService connection settings
  stat:
    path: "{{ splunk.home }}/etc/system/local/.kvservice-connection-string-managed"
  register: kvservice_connection_managed

- name: Remove previous Ansible-managed KVService connection settings
  block:
    - name: Remove previous KVService connection string
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceConnectionString
        state: absent

    - name: Remove KVService connection management marker
      file:
        path: "{{ splunk.home }}/etc/system/local/.kvservice-connection-string-managed"
        state: absent
  when:
    - kvservice_connection_managed.stat.exists
    - splunk.kvstore.kvservice_connection_string | default('') | length == 0

- name: Set KVService connection string
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceConnectionString
    value: "{{ splunk.kvstore.kvservice_connection_string }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.kvstore.kvservice_connection_string | default('') | length > 0

- name: Set KVService tenant
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: tenant
    value: "{{ splunk.scs.tenant }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.tenant is defined
    - splunk.scs.tenant | length > 0

- name: Set KVService environment
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: environment
    value: "{{ splunk.scs.environment }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.environment is defined
    - splunk.scs.environment | length > 0

- name: Mark KVService connection settings as Ansible-managed
  copy:
    content: "kvserviceConnectionString\n"
    dest: "{{ splunk.home }}/etc/system/local/.kvservice-connection-string-managed"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0644'
  when:
    - splunk.kvstore.kvservice_connection_string | default('') | length > 0

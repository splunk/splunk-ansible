---
- name: Check for Ansible-managed single-customer KVService settings
  stat:
    path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
  register: kvservice_managed_config

- name: Remove previous Ansible-managed single-customer KVService settings
  block:
    - name: Remove previous KVService deployment mode
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: kvstore
        option: kvserviceDeploymentMode
        state: absent

    - name: Remove previous KVService tenant
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: tenant
        state: absent

    - name: Remove previous KVService environment
      ini_file:
        dest: "{{ splunk.home }}/etc/system/local/server.conf"
        section: scs
        option: environment
        state: absent

    - name: Remove single-customer KVService management marker
      file:
        path: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
        state: absent
  when:
    - kvservice_managed_config.stat.exists
    - splunk.kvstore.deployment_mode | default('') != 'singleCustomer'

- name: Remove legacy KVService connection string
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceConnectionString
    state: absent

- name: Set KVService deployment mode
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: kvserviceDeploymentMode
    value: "{{ splunk.kvstore.deployment_mode }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.kvstore is defined
    - splunk.kvstore.deployment_mode is defined
    - splunk.kvstore.deployment_mode | length > 0

- name: Set KVService tenant
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: tenant
    value: "{{ splunk.scs.tenant }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.tenant is defined
    - splunk.scs.tenant | length > 0

- name: Set KVService environment
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: scs
    option: environment
    value: "{{ splunk.scs.environment }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - splunk.scs is defined
    - splunk.scs.environment is defined
    - splunk.scs.environment | length > 0

- name: Mark single-customer KVService settings as Ansible-managed
  copy:
    content: "singleCustomer\n"
    dest: "{{ splunk.home }}/etc/system/local/.kvservice-single-customer-managed"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0644'
  when:
    - splunk.kvstore.deployment_mode | default('') == 'singleCustomer'

---
- name: Read the installed release without invoking Splunk first-time-run
  slurp:
    src: "{{ splunk.home }}/etc/splunk.version"
  register: kvservice_installed_release_file
  become: yes
  become_user: "{{ splunk.user }}"

- name: Resolve the installed release for KVService startup policy
  set_fact:
    kvservice_installed_release: "{{ kvservice_installed_release_file.content | b64decode | regex_findall(regexp) | default(['0'], true) | first }}"
  vars:
    regexp: '(?m)^VERSION=([0-9]+(?:\.[0-9]+){2,3})'

- name: Resolve KVService startup policy version boundaries
  set_fact:
    kvservice_release_is_10_6: >-
      {{ kvservice_installed_release is version('10.6.0', '>=')
         and kvservice_installed_release is version('10.7.0', '<') }}
    kvservice_release_supports_migration: "{{ kvservice_installed_release is version('10.9.0', '>=') }}"

- name: Select local KV Store for 10.6 or disabled KVService
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: defaultKVStoreType
    value: local
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when: >-
    kvservice_release_is_10_6 | bool
    or (kvservice_release_supports_migration | bool
        and not (splunk_kvservice_enabled | bool))

- name: Configure indexers to use external KV Store on supported releases
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  loop:
    - {option: disabled, value: "true"}
    - {option: defaultKVStoreType, value: external}
    - {option: forceLocalForInternalCollections, value: "false"}
    - {option: shutDownMongo, value: "true"}
  when:
    - kvservice_release_supports_migration | bool
    - splunk_kvservice_enabled | bool
    - splunk.role == "splunk_indexer"

- name: Set the explicitly selected KVService startup migration policy
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: postgresMigrateOnStartup
    value: "{{ 'true' if kvservice_release_supports_migration | bool and splunk_kvservice_enabled | bool else 'false' }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when: kvservice_release_is_10_6 | bool or kvservice_release_supports_migration | bool

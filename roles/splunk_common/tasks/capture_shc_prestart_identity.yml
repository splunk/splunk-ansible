---
- name: Inspect the existing local server configuration
  stat:
    path: "{{ splunk.home }}/etc/system/local/server.conf"
  register: shc_prestart_existing_server_conf_stat
  changed_when: false
  become: yes
  become_user: "{{ splunk.user }}"

- name: Read the existing local server configuration
  slurp:
    src: "{{ splunk.home }}/etc/system/local/server.conf"
  register: shc_prestart_existing_server_conf
  when: shc_prestart_existing_server_conf_stat.stat.exists
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

- name: Preserve the existing SHC cluster identity
  set_fact:
    shc_prestart_cluster_id: >-
      {{
        (
          (
            shc_prestart_existing_server_conf.content
            | default("")
            | b64decode
          )
          | default("")
          | regex_findall("(?m)^id\\s*=\\s*([^\\r\\n]+?)\\s*$")
          | first
        )
        | default("")
        | trim
      }}
  no_log: true

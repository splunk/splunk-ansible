---
- name: Enable Web SSL
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/web.conf"
    section: settings
    option: "enableSplunkWebSSL"
    value: "{{ splunk.http_enableSSL }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
    mode: 0660
  become: true
  become_user: "{{ splunk.user }}"

- name: Set Web certificate path
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/web.conf"
    section: settings
    option: "serverCert"
    value: "{{ splunk.http_enableSSL_cert }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
    mode: 0660
  when:
    - splunk.http_enableSSL_cert is defined
    - splunk.http_enableSSL_cert
  become: true
  become_user: "{{ splunk.user }}"

- name: Set Web private key path
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/web.conf"
    section: settings
    option: "privKeyPath"
    value: "{{ splunk.http_enableSSL_privKey }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
    mode: 0660
  when:
    - splunk.http_enableSSL_privKey is defined
    - splunk.http_enableSSL_privKey
  become: true
  become_user: "{{ splunk.user }}"

- name: Set Web private key password
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/web.conf"
    section: settings
    option: "sslPassword"
    value: "{{ splunk.http_enableSSL_privKey_password }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
    mode: 0660
  when:
    - splunk.http_enableSSL_privKey_password is defined
    - splunk.http_enableSSL_privKey_password
  become: true
  become_user: "{{ splunk.user }}"

---
- name: Set requested default KV Store type
  set_fact:
    kvstore_requested_default_type: "{{ splunk.kvstore.default_kvstore_type | default('', true) }}"

- name: Validate default KV Store type
  assert:
    that:
      - kvstore_requested_default_type in ["cohosted", "external", "local"]
    fail_msg: "splunk.kvstore.default_kvstore_type must be 'cohosted', 'external', or 'local'"
  when: kvstore_requested_default_type | length > 0

- name: Retrieve installed Splunk version for default KV Store type
  command: "{{ splunk.exec }} version --accept-license --answer-yes --no-prompt"
  register: kvstore_installed_splunk_version_cmd
  become: yes
  become_user: "{{ splunk.user }}"
  changed_when: false

- name: Set installed Splunk version fact for default KV Store type
  set_fact:
    kvstore_installed_splunk_version: "{{ kvstore_installed_splunk_version_cmd.stdout | regex_search(regexp, '\\1') | default(['0'], true) }}"
  vars:
    regexp: 'Splunk(?:\sUniversal\sForwarder)?\s((\d+)\.(\d+)\.(\d+)(?:\.\d+)?).*'

- name: Set default KV Store type support fact
  set_fact:
    kvstore_default_type_supported: >-
      {{ kvstore_installed_splunk_version[0] is version('10.6.0', '>=')
         and kvstore_installed_splunk_version[0] is version('10.9.0', '<') }}

- name: Skip default KV Store type for unsupported Splunk version
  debug:
    msg: "Skipping splunk.kvstore.default_kvstore_type={{ splunk.kvstore.default_kvstore_type }} because Ansible manages it only when 10.6.0 <= Splunk version < 10.9.0. Installed version is {{ kvstore_installed_splunk_version[0] | default('unknown') }}."
  when:
    - kvstore_requested_default_type | length > 0
    - not (kvstore_default_type_supported | default(false) | bool)

- name: Set default KV Store type
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: "defaultKVStoreType"
    value: "{{ kvstore_requested_default_type }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - kvstore_requested_default_type | length > 0
    - kvstore_default_type_supported | default(false) | bool

- name: Set Postgres migrate on startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: "postgresMigrateOnStartup"
    value: >-
      {{ 'false' if kvstore_installed_splunk_version[0] is version('10.9.0', '<')
         and kvstore_requested_default_type == 'local'
         else 'true' }}
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when:
    - kvstore_installed_splunk_version[0] is version('10.6.0', '>=')
    - kvstore_installed_splunk_version[0] is version('10.9.0', '>=') or kvstore_requested_default_type | length > 0

---
- name: Validate default KV Store type
  assert:
    that:
      - splunk.kvstore.default_kvstore_type in ["cohosted", "external", "local"]
    fail_msg: "splunk.kvstore.default_kvstore_type must be 'cohosted', 'external', or 'local'"
  when:
    - splunk.kvstore.default_kvstore_type | default(none) is not none
    - splunk.kvstore.default_kvstore_type | default('') | length > 0

- name: Read installed Splunk version without invoking first-time-run
  slurp:
    src: "{{ splunk.home }}/etc/splunk.version"
  register: kvstore_installed_splunk_version_file
  become: yes
  become_user: "{{ splunk.user }}"
  when: kvstore_installed_splunk_version is not defined

- name: Set installed Splunk version fact for default KV Store type
  set_fact:
    kvstore_installed_splunk_version: "{{ kvstore_installed_splunk_version_file.content | b64decode | regex_findall(regexp) | default(['0'], true) }}"
  vars:
    regexp: '(?m)^VERSION=([0-9]+(?:\.[0-9]+){2,3})'
  when: kvstore_installed_splunk_version is not defined

- name: Set default KV Store type support fact
  set_fact:
    kvstore_default_type_supported: >-
      {{ kvstore_installed_splunk_version[0] is version('10.6.0', '>=')
         and kvstore_installed_splunk_version[0] is version('10.9.0', '<') }}

- name: Skip default KV Store type for unsupported Splunk version
  debug:
    msg: "Ansible enforces local KV Store only when 10.6.0 <= Splunk version < 10.9.0. Installed version is {{ kvstore_installed_splunk_version[0] | default('unknown') }}."
  when: not (kvstore_default_type_supported | default(false) | bool)

- name: Keep pre-10.9 KV Store local
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: "defaultKVStoreType"
    value: "local"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when: kvstore_default_type_supported | default(false) | bool

- name: Disable pre-10.9 Postgres migration on startup
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: kvstore
    option: "postgresMigrateOnStartup"
    value: "false"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  when: kvstore_default_type_supported | default(false) | bool

---
- include_tasks: get_splunk_status.yml

- name: "Start Splunk"
  when: splunk_status.rc != 0
  block:
  - name: Cleanup Splunk runtime files
    file:
      state: absent
      path: "{{ item }}"
    with_items:
      - "{{ splunk.home }}/var/run/splunk/splunkd.pid"
      - "{{ splunk.home }}/var/lib/splunk/kvstore/mongo/mongod.lock"
    become: yes
    become_user: "{{ splunk.user }}"

  - name: "Restrict permissions on splunk.key"
    include_tasks: restrict_permissions.yml
    vars:
      file_path: "{{ item }}"
    with_items:
      - "{{ splunk.home }}/var/lib/splunk/kvstore/mongo/splunk.key"

  - name: "Start Splunk via CLI"
    command: "{{ splunk.exec }} start --accept-license --answer-yes --no-prompt"
    register: start_splunk
    changed_when: start_splunk.rc == 0 and 'already running' not in start_splunk.stdout
    failed_when: false
    when: not splunk.enable_service
    become: yes
    become_user: "{{ splunk.user }}"

  # A failed `splunk start` can leave splunkd and mongod running while Splunk
  # completes a slow KV Store startup. Reissuing `splunk start` in that state
  # turns the live KV Store listener into a false port-conflict failure. Poll
  # the process started by the first command instead of starting it again.
  - name: "Wait for Splunk after a non-zero CLI start"
    command: "{{ splunk.exec }} status --accept-license --answer-yes --no-prompt"
    register: start_splunk_status
    changed_when: false
    failed_when: false
    until: start_splunk_status.rc == 0
    retries: "{{ wait_for_splunk_retry_num }}"
    delay: "{{ retry_delay }}"
    when:
      - not splunk.enable_service
      - start_splunk.rc | default(0) != 0
    become: yes
    become_user: "{{ splunk.user }}"

  - name: "Start Splunk via service"
    service:
      name: "{{ splunk_service_name }}"
      state: started
    become: yes
    become_user: "{{ privileged_user }}"
    when:
      - splunk.enable_service
      - ansible_system is match("Linux")

  - name: "Start Splunk via Windows service"
    win_service:
      name: splunkd
      state: started
    when:
      - splunk.enable_service
      - ansible_os_family == "Windows"

- include_tasks: check_uds_file.yml

- name: "Wait for splunkd management port"
  wait_for:
    port: "{{ splunk.svc_port }}"
  when: not uds_enabled | bool

- name: Flush restart handlers
  meta: flush_handlers

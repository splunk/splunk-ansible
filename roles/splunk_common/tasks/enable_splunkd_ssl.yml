---
# By default, splunkd responds on SSL - only update 'enableSplunkdSSL' if purposely disabled 
- name: Enable Splunkd SSL
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: enableSplunkdSSL
    value: "false"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
    state: "{{ 'absent' if splunk.ssl.enable else 'present' }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: "'enable' in splunk.ssl"

- name: Set Splunkd CA
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: sslRootCAPath
    value: "{{ splunk.ssl.ca }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: "'ca' in splunk.ssl and splunk.ssl.ca"

- name: Set Splunkd cert
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: serverCert
    value: "{{ splunk.ssl.cert }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: "'cert' in splunk.ssl and splunk.ssl.cert"

- name: Set Splunkd SSL password
  splunk_config:
    module: ini_file
    home: "{{ splunk.home }}"
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: sslPassword
    value: "{{ splunk.ssl.password }}"
    owner: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.user }}"
    group: "{{ omit if ansible_system is match('CYGWIN.*|Win32NT') else splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  when: "'password' in splunk.ssl and splunk.ssl.password"
  changed_when: false

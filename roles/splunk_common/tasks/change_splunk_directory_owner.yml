---
- name: Display retry parameters - Update Splunk directory owner
  debug:
    msg: "retry_delay is set to {{ retry_delay }}, and retry_num is set to {{ retry_num }}"

- name: Update Splunk directory owner
  file:
    path: "{{ splunk.home }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    recurse: yes
  become: yes
  become_user: "{{ privileged_user }}"
  register: cmd_result
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  until: not cmd_result.failed

---
# TODO: Remove all secondary conditionals on deprecation of splunk.hec_* variables

- name: Get existing HEC token
  splunk_api:
    url: "/services/data/inputs/http/splunk_hec_token?output_mode=json"
    method: GET
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    status_code: [200, 404]
    svc_port: "{{ splunk.svc_port }}"
  register: hec_token
  when: ('hec' in splunk and 'token' in splunk.hec) or ('hec_token' in splunk)

- name: Attempt
  debug:
    msg: "{{ hec_token.status }}"

# The REST API does not support modifying tokens in-place, so we'll need to delete/re-create
- name: Remove existing HEC token
  splunk_api:
    url: "/services/data/inputs/http/splunk_hec_token"
    method: DELETE
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    status_code: [200, 404]
    svc_port: "{{ splunk.svc_port }}"
    timeout: 60
    use_proxy: no
  register: delete_hec_token
  changed_when: delete_hec_token.status == 200
  when:
    #- "splunk.splunk_http_enabled"
    - hec_token is defined and hec_token.status == 200
    - ('hec' in splunk and 'token' in splunk.hec and hec_token.json['entry'][0]['content']['token'] != splunk.hec.token) or ('hec_token' in splunk and hec_token.json['entry'][0]['content']['token'] != splunk.hec_token)
  no_log: "{{ hide_password }}"

- name: Update HEC token configuration
  splunk_api:
    url: "/services/data/inputs/http"
    method: POST
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    svc_port: "{{ splunk.svc_port }}"
    body:
      name: "splunk_hec_token"
      token: "{% if 'hec' in splunk and 'token' in splunk.hec and splunk.hec.token %}{{ splunk.hec.token }}{% else %}{{ splunk.hec_token }}{% endif %}"
    body_format: "form-urlencoded"
    status_code: [201,409]
  register: create_hec_token
  changed_when: create_hec_token.status == 201
  when:
    - ('hec' in splunk and 'token' in splunk.hec and splunk.hec.token) or ('hec_token' in splunk and splunk.hec_token)

- name: Build global HEC body
  set_fact:
    hec_global_body: >-
      {{
        {
          'disabled': '0' if (('hec' in splunk and 'enable' in splunk.hec and splunk.hec.enable | bool) or ('hec_disabled' in splunk and not splunk.hec_disabled | bool)) else '1',
          'port': splunk.hec.port if ('hec' in splunk and 'port' in splunk.hec and splunk.hec.port) else (splunk.hec_port if ('hec_port' in splunk and splunk.hec_port) else '8088'),
          'serverCert': splunk.hec.cert if ('hec' in splunk and 'cert' in splunk.hec and splunk.hec.cert) else '',
          'sslPassword': splunk.hec.password if ('hec' in splunk and 'password' in splunk.hec and splunk.hec.password) else ''
        }
        | combine(
            {'enableSSL': '1' if splunk.hec.ssl | bool else '0'}
            if ('hec' in splunk and 'ssl' in splunk.hec and splunk.hec.ssl is not none)
            else ({'enableSSL': '1' if splunk.hec_enableSSL | bool else '0'} if ('hec_enableSSL' in splunk) else {})
          )
      }}
  when: >-
    ('hec' in splunk and ('enable' in splunk.hec or 'ssl' in splunk.hec or 'port' in splunk.hec or 'cert' in splunk.hec or 'password' in splunk.hec))
    or ('hec_disabled' in splunk)
    or ('hec_enableSSL' in splunk)
    or ('hec_port' in splunk)

- name: Setup global HEC
  splunk_api:
    url: "/services/data/inputs/http/http"
    method: POST
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ splunk.admin_user }}"
    password: "{{ splunk.password }}"
    svc_port: "{{ splunk.svc_port }}"
    body: "{{ hec_global_body }}"
    body_format: "form-urlencoded"
  register: sample
  when: hec_global_body is defined

---
# Configure Splunk server certificate from operator-mounted TLS secret.
# Input: /mnt/tls/splunk-server-tls-cert/{tls.crt, tls.key[, ca.crt]}
# Output: bundled PEM at /opt/splunk/etc/auth/splunk-server-bundle.pem
#         CA at /opt/splunk/etc/auth/splunk-server-ca.pem
#         server.conf [sslConfig] configured

- name: Generate ephemeral SSL passphrase
  command: >
    python3 -c
    "import secrets, base64; print(base64.b64encode(secrets.token_bytes(40)).decode())"
  register: ssl_passphrase
  changed_when: false
  no_log: true

- name: Ensure Splunk auth directory exists
  file:
    path: "{{ splunk.home }}/etc/auth"
    state: directory
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0700'
  become: yes
  become_user: "{{ splunk.user }}"

- name: Write cert bundle script
  copy:
    dest: /tmp/splunk_bundle_cert.py
    content: |
      from cryptography.hazmat.primitives.serialization import (
          load_pem_private_key, Encoding, PrivateFormat, BestAvailableEncryption
      )
      import sys

      passphrase = sys.argv[1].encode()
      key_path   = '/mnt/tls/splunk-server-tls-cert/tls.key'
      cert_path  = '/mnt/tls/splunk-server-tls-cert/tls.crt'
      out_path   = sys.argv[2] + '/etc/auth/splunk-server-bundle.pem'

      with open(key_path, 'rb') as f:
          key = load_pem_private_key(f.read(), password=None)

      enc_key_pem = key.private_bytes(
          Encoding.PEM,
          PrivateFormat.PKCS8,
          BestAvailableEncryption(passphrase)
      )

      with open(cert_path, 'rb') as f:
          cert_pem = f.read()

      with open(out_path, 'wb') as f:
          f.write(cert_pem)
          if not cert_pem.endswith(b'\n'):
              f.write(b'\n')
          f.write(enc_key_pem)
    mode: '0700'

- name: Encrypt private key and build server cert bundle
  command: >
    python3 /tmp/splunk_bundle_cert.py
    {{ ssl_passphrase.stdout }} {{ splunk.home }}
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true

- name: Set bundle permissions
  file:
    path: "{{ splunk.home }}/etc/auth/splunk-server-bundle.pem"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0600'
  become: yes
  become_user: "{{ splunk.user }}"

- name: Check if ca.crt is present in server cert mount
  stat:
    path: /mnt/tls/splunk-server-tls-cert/ca.crt
  register: server_ca_file

- name: Set sslRootCAPath to system bundle when ca.crt is absent
  set_fact:
    server_ca_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  when: not server_ca_file.stat.exists

- name: Write CA trust bundle script
  copy:
    dest: /tmp/splunk_build_server_ca_bundle.py
    content: |
      # tls.crt from the operator-mounted secret may contain intermediate
      # certs that are not repeated in ca.crt (e.g. Vault PKI issuers put
      # only the root in ca.crt). Splunk requires the full chain to be
      # present locally in sslRootCAPath -- it does not complete the chain
      # using intermediates presented by the peer during the handshake.
      # Assemble tls.crt's non-leaf certs + ca.crt into one deduplicated
      # trust bundle.
      import sys

      tls_crt_path = '/mnt/tls/splunk-server-tls-cert/tls.crt'
      ca_crt_path = '/mnt/tls/splunk-server-tls-cert/ca.crt'
      out_path = sys.argv[1] + '/etc/auth/splunk-server-ca.pem'

      def split_pem_certs(data):
          certs = []
          current = []
          for line in data.splitlines(keepends=True):
              if line.strip() == b'-----BEGIN CERTIFICATE-----':
                  current = [line]
              elif line.strip() == b'-----END CERTIFICATE-----':
                  current.append(line)
                  certs.append(b''.join(current))
                  current = []
              elif current:
                  current.append(line)
          return certs

      with open(tls_crt_path, 'rb') as f:
          tls_certs = split_pem_certs(f.read())
      chain_certs = tls_certs[1:]  # drop the leaf; keep any presented intermediates/root

      with open(ca_crt_path, 'rb') as f:
          ca_certs = split_pem_certs(f.read())

      seen = set()
      ordered = []
      for cert in chain_certs + ca_certs:
          if cert not in seen:
              seen.add(cert)
              ordered.append(cert)

      with open(out_path, 'wb') as f:
          for cert in ordered:
              f.write(cert)
              if not cert.endswith(b'\n'):
                  f.write(b'\n')
    mode: '0700'
  when: server_ca_file.stat.exists

- name: Build server CA trust bundle
  command: >
    python3 /tmp/splunk_build_server_ca_bundle.py
    {{ splunk.home }}
  become: yes
  become_user: "{{ splunk.user }}"
  changed_when: true
  when: server_ca_file.stat.exists

- name: Set CA trust bundle permissions
  file:
    path: "{{ splunk.home }}/etc/auth/splunk-server-ca.pem"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
    mode: '0644'
  become: yes
  become_user: "{{ splunk.user }}"
  when: server_ca_file.stat.exists

- name: Set sslRootCAPath to the assembled CA trust bundle
  set_fact:
    server_ca_path: "{{ splunk.home }}/etc/auth/splunk-server-ca.pem"
  when: server_ca_file.stat.exists

- name: Configure serverCert in server.conf
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: serverCert
    value: "{{ splunk.home }}/etc/auth/splunk-server-bundle.pem"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"

- name: Configure sslPassword in server.conf
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: sslPassword
    value: "{{ ssl_passphrase.stdout }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"
  no_log: true
  changed_when: false

- name: Configure sslRootCAPath in server.conf
  ini_file:
    dest: "{{ splunk.home }}/etc/system/local/server.conf"
    section: sslConfig
    option: sslRootCAPath
    value: "{{ server_ca_path }}"
    owner: "{{ splunk.user }}"
    group: "{{ splunk.group }}"
  become: yes
  become_user: "{{ splunk.user }}"

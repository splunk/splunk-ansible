---
- name: "Restart Noah-managed splunkd - Via bounded CLI stop and start"
  shell: |
    set -e
    if {{ splunk.exec }} status >/dev/null 2>&1; then
      {{ splunk.exec }} stop --answer-yes
    fi
    {{ splunk.exec }} start --answer-yes --accept-license
  args:
    executable: /bin/sh
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ restart_retry_delay }}"
  when:
    - not splunk.enable_service
    - splunk_noah_enabled | default(false) | bool

- name: "Restart classic splunkd service - Via CLI"
  command: "{{ splunk.exec }} restart --answer-yes --accept-license"
  become: yes
  become_user: "{{ splunk.user }}"
  register: task_result
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ restart_retry_delay }}"
  when:
    - not splunk.enable_service
    - not (splunk_noah_enabled | default(false) | bool)

- name: "Restart the splunkd service - Via Linux systemd or init"
  service:
    name: "{{ splunk_service_name }}"
    state: restarted
  when: splunk.enable_service and ansible_system is match("Linux")
  become: yes
  become_user: "{{ privileged_user }}"

- name: "Restart the splunkd service - Via windows system"
  win_service:
    name: "{{ splunk_service_name }}"
    state: restarted
  when: splunk.enable_service and not ansible_system is match("Linux")

- include_tasks: ../tasks/check_uds_file.yml

- name: "Wait for splunkd management port"
  wait_for:
    port: "{{ splunk.svc_port }}"
  when: not uds_enabled | bool
